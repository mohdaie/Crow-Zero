<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Crow-Zero City Editor</title>
<style>
/* Layout: a site plan filling the screen, with a details rail (bottom sheet on phones). */
:root{
  --paper:#f9f4e5;--panel:#fffaf0;--ink:#243f37;--muted:#6f786c;--line:#d9d2bd;--green:#244e43;--gold:#c99c4e;
  --lawn:#dfe5c6;--edge:#c9d1ad;--river:#82aaa2;--asphalt:#a7aca5;--dirt:#d3c398;--floor:#efe8d2;
  --error:#b8433a;--warn:#b77b16;--ok:#3f7a55;--select:#1b2f29;
  --display:Georgia,"Times New Roman",serif;--body:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#16241f;--panel:#1c2d27;--ink:#ece4cd;--muted:#a9b29f;--line:#33463e;--green:#8fc3a9;--gold:#d9b06a;
  --lawn:#2b3b2e;--edge:#3d4f3b;--river:#3f6a66;--asphalt:#5e6560;--dirt:#77694a;--floor:#3a3a2c;
  --error:#ef7d6f;--warn:#e7ad4e;--ok:#7fc99a;--select:#fff3d2;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#16241f;--panel:#1c2d27;--ink:#ece4cd;--muted:#a9b29f;--line:#33463e;--green:#8fc3a9;--gold:#d9b06a;
  --lawn:#2b3b2e;--edge:#3d4f3b;--river:#3f6a66;--asphalt:#5e6560;--dirt:#77694a;--floor:#3a3a2c;
  --error:#ef7d6f;--warn:#e7ad4e;--ok:#7fc99a;--select:#fff3d2;color-scheme:dark}
html,body{height:100%}body{height:100dvh}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font:14px/1.45 var(--body);margin:0;overflow:hidden}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 11px;min-height:36px}
button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--green);border-color:var(--green);color:var(--paper);font-weight:650}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto minmax(0,1fr)}
.bar{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{font:33px/1 var(--display);letter-spacing:-7px;padding-right:7px;color:var(--green)}
.mark span{color:#b56b3b}
.brand strong{font:20px/1.1 var(--display);font-weight:400;display:block}
.brand small{display:block;font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:650;border:1px solid currentColor}
.pill.ok{color:var(--ok)}.pill.error{color:var(--error)}.pill.warn{color:var(--warn)}
.bar .spacer{flex:1}
.bar .actions{display:flex;gap:8px;flex-wrap:wrap}
.stage{grid-row:2;grid-column:1;position:relative;min-height:0;background:var(--edge)}
#map{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.mapbar{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.mapbar button{width:38px;padding:0;font-weight:700}
.floater{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:flex;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px 6px 5px 12px;box-shadow:0 4px 18px rgba(20,40,30,.14);max-width:calc(100% - 80px)}
.floater span{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.scale{position:absolute;left:12px;bottom:12px;font:11px var(--mono);color:var(--ink);background:color-mix(in srgb,var(--panel) 85%,transparent);padding:4px 8px;border-radius:7px}
.panel{grid-row:2;grid-column:2;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:18px}
.panel h2{font:19px/1.2 var(--display);font-weight:400;margin:0 0 6px}
.eyebrow{font-size:10px;font-weight:750;letter-spacing:1.8px;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.panel p{margin:0;color:var(--muted)}
.rows{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0;font-variant-numeric:tabular-nums}
.rows dt{color:var(--muted)}.rows dd{margin:0}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 8px;width:96px}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.checks li button{width:100%;text-align:left;display:flex;gap:8px;align-items:flex-start;border-radius:10px;padding:8px 10px}
.checks .dot{flex:none;width:9px;height:9px;border-radius:50%;margin-top:6px}
.checks .error .dot{background:var(--error)}.checks .warning .dot{background:var(--warn)}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:4px 10px;font-size:12px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.saveinfo{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:2px;margin:-16px -16px 0;padding:6px 10px 0;border-bottom:1px solid var(--line);position:sticky;top:-16px;background:var(--panel);z-index:2}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;font-weight:650;color:var(--muted);padding:8px 10px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.pane{display:flex;flex-direction:column;gap:18px}
.search{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:8px 10px}
.cat h3{font:16px/1.2 var(--display);font-weight:400;margin:4px 0 8px;display:flex;align-items:center;gap:8px}
.cat h3 i{width:10px;height:10px;border-radius:3px;display:inline-block}
.cat h3 small{margin-left:auto;font:11px var(--body);color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:6px}
.card{position:relative}
.card>button:first-child{width:100%;height:100%;display:flex;flex-direction:column;align-items:stretch;gap:3px;text-align:left;padding:8px;border-radius:10px}
.card svg{width:100%;height:46px;display:block}
.card b{font-size:12.5px;line-height:1.25;font-weight:650}
.card small{font-size:11px;color:var(--muted)}
.card .x{position:absolute;top:4px;right:4px;min-height:0;width:24px;height:24px;padding:0;border-radius:7px;font-size:12px;line-height:1}
.sides{display:grid;grid-template-columns:1fr auto auto;gap:6px 8px;align-items:center}
.field input[type=color]{padding:2px;height:34px}
.field input.wide{width:100%}
.note{font-size:12px;color:var(--muted)}
.confirm{display:flex;flex-direction:column;gap:8px;border:1px solid var(--error);border-radius:10px;padding:10px}
a{color:var(--green)}
svg text{font-family:var(--body);pointer-events:none}
.unit{cursor:grab}.unit.dragging{cursor:grabbing}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(180px,1.2fr) minmax(160px,1fr)}
  .stage{grid-row:2;grid-column:1}
  .panel{grid-row:3;grid-column:1;border-left:0;border-top:1px solid var(--line)}
  .bar{padding:8px 16px}
  .brand strong{font-size:17px}.mark{font-size:26px}
}
@media (max-width:1000px) and (max-height:500px) and (orientation:landscape){
  .app{grid-template-columns:minmax(0,1fr) 280px;grid-template-rows:auto minmax(0,1fr)}
  .stage{grid-row:2;grid-column:1}
  .panel{grid-row:2;grid-column:2;border-top:0;border-left:1px solid var(--line)}
  .bar{padding:6px 10px;gap:6px}.brand strong{font-size:16px}.brand small{display:none}
  .bar .actions{gap:4px}.bar button{padding:6px 8px}
}
@media (prefers-reduced-motion:no-preference){.floater{transition:opacity .15s}}
</style>

<div class="app">
  <header class="bar">
    <div class="brand"><span class="mark" aria-hidden="true">C<span>Z</span></span><div><strong>Crow-Zero · City Editor</strong><small>Bina bandar sendiri · map editor</small></div></div>
    <span id="status" class="pill ok" role="status">Checking…</span>
    <span class="spacer"></span>
    <div class="actions">
      <button id="undo" aria-label="Undo" title="Undo (Ctrl+Z)">Undo</button>
      <button id="redo" aria-label="Redo" title="Redo (Ctrl+Shift+Z)">Redo</button>
      <button id="new-map">Map kosong</button><button id="import">Import JSON</button><input id="import-file" type="file" accept=".json,application/json" hidden><button id="export">Export JSON</button><button id="save" class="primary">Simpan</button>
    </div>
  </header>
  <main class="stage">
    <svg id="map" aria-label="Town plan. Drag buildings and roads to move them."></svg>
    <div class="floater" id="floater" hidden>
      <span id="floater-name"></span>
      <button id="turn-left" aria-label="Turn left 90 degrees" title="Turn left (Shift+R)">↺</button>
      <button id="turn-right" aria-label="Turn right 90 degrees" title="Turn right (R)">↻</button>
      <button id="deselect" aria-label="Deselect" title="Deselect (Esc)">✕</button>
    </div>
    <div class="mapbar">
      <button id="zoom-in" aria-label="Zoom in">+</button>
      <button id="zoom-out" aria-label="Zoom out">−</button>
      <button id="zoom-fit" aria-label="Fit the whole town" title="Fit">⤢</button>
    </div>
    <div class="scale" id="scale">10 m</div>
  </main>
  <aside class="panel">
    <nav class="tabs" role="tablist" aria-label="Editor tools">
      <button role="tab" data-tab="edit" aria-selected="true">Edit</button>
      <button role="tab" data-tab="library" aria-selected="false">+ Aset</button>
      <button role="tab" data-tab="town" aria-selected="false">Saiz peta</button>
    </nav>
    <div class="pane" data-pane="library" hidden>
      <input id="lib-search" class="search" type="search" placeholder="Cari bangunan, pokok atau kategori…" aria-label="Search buildings">
      <div class="pane" id="library"></div>
    </div>
    <div class="pane" data-pane="town" id="town-size" hidden></div>
    <div class="pane" data-pane="edit">
    <section id="selection"></section>
    <section>
      <p class="eyebrow">Layout checks</p>
      <ul class="checks" id="checks"></ul>
    </section>
    <section>
      <p class="eyebrow">Save and try it</p>
      <div class="tools">
        <button id="save-2" class="primary">Save layout</button>
        <button id="copy">Copy layout</button>
        <a id="preview" class="preview" href="#" target="_blank" rel="noopener">Preview FPS ↗</a>
        <a id="play" class="preview" href="#" target="_blank" rel="noopener">Main: Operasi Gagak ▶</a>
      </div>
      <p class="saveinfo" id="saveinfo" role="status" style="margin-top:8px"></p>
      <textarea id="copybox" hidden readonly style="width:100%;height:90px;margin-top:8px;font:11px var(--mono)"></textarea>
    </section>
    <section>
      <p class="eyebrow">Districts</p>
      <div class="legend" id="legend"></div>
    </section>
    <section id="reset-zone">
      <button id="reset">Map kosong baru</button>
    </section>
    </div>
  </aside>
</div>

<script type="module">
const TOWN_PLAN = {"version":1,"name":"Bandar Baru","bounds":{"minX":-100,"maxX":100,"minZ":-100,"maxZ":100},"units":[],"roads":[]};

// Town plan geometry shared by the game, the tests and the map editor. The
// editable positions live in town-plan.js; everything here is derived from
// them. Rects are [x, z, w, d] in metres, centred, in a unit's own frame.
// The town edge comes from the plan's optional `bounds`, which the map editor
// grows or shrinks a side at a time; GROUND is the land around it.
const DEFAULT_BOUNDS = { minX: -100, maxX: 100, minZ: -100, maxZ: 100 };
const BOUNDS_LIMIT = 200;
function boundsOf(plan) {
  const b = { ...DEFAULT_BOUNDS, ...(plan?.bounds || {}) }, L = BOUNDS_LIMIT;
  return { minX: Math.max(-L, Math.min(-20, +b.minX)), maxX: Math.min(L, Math.max(20, +b.maxX)), minZ: Math.max(-L, Math.min(-20, +b.minZ)), maxZ: Math.min(L, Math.max(20, +b.maxZ)) };
}
const groundOf = B => ({ minX: B.minX - 11, maxX: B.maxX + 13, minZ: B.minZ - 13, maxZ: B.maxZ + 13 });
// The river is fixed terrain. Every road that crosses it gets a bridge as
// wide as the road; the old footbridge stays where no road crosses nearby.
// No fixed river in a blank city. Keep the shared terrain interface for roads/grass.
const RIVER = { x: 10000, w: 0 };
const BANKS = [RIVER.x - 5, RIVER.x + 5];
function bridgesFor() { return []; }
const DISTRICT_INFO = [
  { id: 'kampung', name: 'Kampung Melati', short: 'KAMPUNG', color: '#c87537' },
  { id: 'terrace', name: 'Taman Kenangan', short: 'TERES', color: '#9271b4' },
  { id: 'pekan', name: 'Pekan lama', short: 'PEKAN', color: '#b95670' },
  { id: 'community', name: 'Sekolah & komuniti', short: 'KOMUNITI', color: '#4a9270' },
  { id: 'transport', name: 'Pasar & stesen bas', short: 'PASAR / BAS', color: '#4b8db4' }
];
// The 38 numbered places: [name, district, kind].
const PLACES = {
  1: ['Rumah Amir', 'kampung', 'home'], 2: ['Rumah Tok', 'kampung', 'house'], 3: ['Rumah Pak Mail', 'kampung', 'house'],
  4: ['Rumah Mak Cik Salmah', 'kampung', 'house'], 5: ['Rumah Jiran A', 'kampung', 'house'], 6: ['Rumah Jiran B', 'kampung', 'house'],
  7: ['Rumah Jiran C', 'kampung', 'house'], 8: ['Rumah Atuk', 'kampung', 'house'], 9: ['Wakaf Kebun', 'kampung', 'pavilion'],
  10: ['Pondok Tepi Sungai', 'kampung', 'pavilion'], 11: ['Rumah Nur', 'terrace', 'terrace'], 12: ['Rumah Kak Lina', 'terrace', 'terrace'],
  13: ['Rumah Pak Abu', 'terrace', 'terrace'], 14: ['Rumah Mei Ling', 'terrace', 'terrace'], 15: ['Rumah Faiz', 'terrace', 'terrace'],
  16: ['Rumah Jiran F', 'terrace', 'terrace'], 17: ['Rumah Jiran G', 'terrace', 'terrace'], 18: ['Rumah Jiran H', 'terrace', 'terrace'],
  19: ['Kedai Sudut Mini', 'terrace', 'mini-shop'], 20: ['Tadika Kenangan', 'terrace', 'nursery'], 21: ['Warung Kak Ita', 'pekan', 'warung'],
  22: ['Kedai Runcit 99', 'pekan', 'shop'], 23: ['Kedai Gunting', 'pekan', 'shop'], 24: ['Kedai Basikal', 'pekan', 'shop'],
  25: ['Alat Tulis & Game', 'pekan', 'shop'], 26: ['Kedai Jahit', 'pekan', 'shop'], 27: ['Klinik & Farmasi', 'pekan', 'shop'],
  28: ['Kedai Roti & Kuih', 'pekan', 'shop'], 29: ['SK Seri Kenangan', 'community', 'school'], 30: ['Kantin Sekolah', 'community', 'canteen'],
  31: ['Masjid Seri Kenangan', 'community', 'mosque'], 32: ['Balai Raya', 'community', 'hall'], 33: ['Perpustakaan Mini', 'community', 'library'],
  34: ['Gelanggang Serbaguna', 'community', 'court'], 35: ['Perhentian Bas', 'transport', 'station'], 36: ['Bengkel & Tayar', 'transport', 'workshop'],
  37: ['Kiosk Petrol Retro', 'transport', 'petrol'], 38: ['Tapak Pasar Malam', 'transport', 'market']
};

// Stilt houses: the verandah and four stair treads are raised floors.
function stiltHouse(w, d, extra = {}) {
  const stairs = [0, 1, 2, 3].map(i => [0, d / 2 + 3.1 - i * .6, 2, .65, .25 + i * .28]);
  // Every kampung house has a TV aerial on a tall pole and a tempayan of water by the stairs.
  const props = [['antenna', w / 2 + .45, -1.5], ['tempayan', -1.9, d / 2 + 2.7], ...(extra.props || [])];
  return { label: 'Kampung house', places: [[0, 0, w, d]], doors: [[0, d / 2 + 4.4]], solids: [[0, 1.725, w + 1, d + 3.45]], floors: [[0, d / 2 + 1.125, w + 1, 2.25, 1.525], ...stairs], ...extra, props };
}
const pavilion = (label, w, d) => ({ label, places: [[0, 0, w, d]], doors: [[0, d / 2 + 1.6]], solids: [[0, .25, w + 1, d + 1.5]], floors: [[0, 0, w, d, .17]] });
const civic = (label, w, d, extra = {}) => ({ label, places: [[0, 0, w, d]], doors: [[0, d / 2 + 1.4]], floors: [], ...extra, solids: [[0, 0, w + 1, d + 1], ...(extra.solids || [])] });

// Street props from around 2001 (see props.js). `r` is the footprint kept clear
// of doors, people and trees, `hit` the round collider at its centre. `wall`
// props hang on their own building; `road` props may stand on a road
// (`dirt`: on a dirt lane only).
const PROPS = {
  motor: { r: .9, hit: .55, road: true }, chairs: { r: 1.1, hit: .9, road: 'dirt' }, kopitiam: { r: .8, hit: .65 }, gas: { r: .25, hit: .2 },
  freezer: { r: .75, hit: .6 }, crates: { r: .55, hit: .5 }, postbox: { r: .35, hit: .26 }, phone: { r: .6, hit: .45 },
  bin: { r: .35, hit: .3 }, tempayan: { r: .4, hit: .36 }, drum: { r: .35, hit: .32 }, cart: { r: 1, hit: .75 },
  rack: { r: .8, hit: .6 }, board: { r: .45, hit: .3 }, ampaian: { r: 1.6, hit: 0 }, banner: { r: .5, hit: 0, road: 'dirt' },
  roadsign: { r: .3, hit: .06, road: true }, antenna: { r: .1, hit: .07, wall: true }, dish: { wall: true }, aircon: { wall: true }, poster: { wall: true }
};

// Each kind lists, in its own frame: `places` (one rect per numbered place),
// `solids` (what may not overlap another unit), `floors` ([x,z,w,d,height]
// raised walkable ground), `spots` ([x,z,heading] for people) and `decor`
// ([species, x, z, size] trees, planted only where they fit, see planting.js;
// `decorVariants` offers several yards to pick from), and `props`
// ([name, x, z, quarter turns, height, print]). `doors` gives one
// interaction point per place, where the player talks to its contact.
// `open` kinds may sit on roads. `cat` files each kind under a CATEGORIES
// heading in the editor's library; `unique` kinds appear once (their builders
// hang on a numbered place); the others can be added again as extra,
// unnumbered buildings.
const CATEGORIES = [
  { id: 'rumah', name: 'Rumah' }, { id: 'kedai', name: 'Kedai & pekan' }, { id: 'komuniti', name: 'Sekolah & komuniti' },
  { id: 'rehat', name: 'Taman & rehat' }, { id: 'jalan', name: 'Pengangkutan' }, { id: 'kenderaan', name: 'Kenderaan & orang' }
];
const KINDS = {
  home: stiltHouse(10, 8, {
    label: 'Rumah Amir and yard',
    solids: [[0, 1.725, 11, 11.45], [0, -7, 20, .12], [-10, 3.5, .12, 21], [-6.5, 14, 7, .12], [7.5, 14, 5, .12], [-7.5, -9, 7.5, .4], [9, 6, 2.4, .55]],
    spots: { spawn: [0, 11, 0] },
    props: [['motor', 6.8, 9.8, 1], ['gas', 4.6, -4.6], ['drum', -4.8, -4.8]],
    decor: [['kelapa', -14, 4, 1.1], ['kelapa', 11.5, -4.5, .95], ['rambutan', -7.2, 10.5, .8], ['pisang', 7.8, -4.6, .95], ['pisang', -14, 11.5, .9], ['mangga', -13.5, 19, .9], ['serai', -8.6, -5.2], ['pandan', -6.6, -5.6], ['cili', -8.7, -2.6]],
    patches: [[-6, 8, 6], [-5, 12, 5], [6, 3, 4], [8, 13, 5], [-7, -4, 5]]
  }),
  // Every kampung house gets one of three yards, picked by its id.
  house: stiltHouse(9, 7, { props: [['motor', 5.6, 6.2, 1]], decorVariants: [
    [['kelapa', -6.8, -1.5, 1], ['pisang', 6.4, -3.2, .9], ['rambutan', 0, -7.8, .8], ['serai', -3.6, 8.2]],
    [['kelapa', 6.8, .5, 1.05], ['kelapa', -7, -4, .9], ['pisang', -6.6, 4.6, .9], ['mangga', .5, -8.4, .85]],
    [['nangka', -7, -1, .9], ['pisang', 6.4, -3, .95], ['pinang', 6.8, 3.6, 1], ['jambu', 0, -7.8, .8], ['pandan', -3.8, 8.4]]
  ] }),
  wakaf: { ...pavilion('Wakaf (garden shelter)', 7, 6), props: [['tempayan', 4.3, 3.2], ['drum', -4.3, 3.4]], decor: [['rambutan', -6.8, -1, .9], ['mangga', 6.8, 1.5, .85], ['pisang', -5.6, 4.8, .85]] },
  pondok: { ...pavilion('Riverside hut', 4, 5), decor: [['kelapa', 0, -5.6, 1], ['buluh', 0, 6.4, .9], ['pisang', -4, 0, .85]] },

  plan.templates = [...list, { id: 'template-' + n, ...look, name: look.name || `Bangunan ${n}` }];
  commit(); showTab('library');
}

// ---------------------------------------------------------------- adding and removing
// New buildings land on the nearest free ground to the middle of the view.
function freeSpot(u) {
  const B = townBounds(), others = town.units;
  const fits = (x, z) => {
    const t = derive({ units: [{ ...u, x, z }], roads: [] }).units[0];
    return t.solids.every(([sx, sz, sw, sd]) => sx - sw / 2 >= B.minX && sx + sw / 2 <= B.maxX && sz - sd / 2 >= B.minZ && sz + sd / 2 <= B.maxZ && Math.abs(sx - RIVER.x) >= (sw + RIVER.w) / 2)
      && !others.some(o => o.solids.some(p => t.solids.some(q => overlap(p, q, .5))))
      && (t.def.open || t.def.vehicle || !plan.roads.some(r => t.solids.some(q => overlap(q, [r.x, r.z, r.w, r.d], .3))));
  };
  const cx = snap(view.cx), cz = snap(view.cz);
  for (let r = 0; r <= 80; r += 2) { const n = Math.max(1, Math.round(r * 1.6)); for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2, x = snap(cx + Math.cos(a) * r), z = snap(cz + Math.sin(a) * r); if (fits(x, z)) return [x, z]; } }
  return [cx, cz];
}
function addUnit(u) {
  [u.x, u.z] = freeSpot(u);
  plan.units.push(u); selected = { type: 'unit', id: u.id };
  showTab('edit'); commit();
}
const addKind = kind => addUnit({ id: nextId(kind), kind, x: 0, z: 0, rot: 0, ...(kind === 'sedan' ? { color: '#d4322c' } : {}) });
const addCustom = look => addUnit({ id: nextId('custom'), kind: 'custom', x: 0, z: 0, rot: 0, ...pickLook(customLook(look)) });
function duplicateSelected() {
  const u = selected?.type === 'unit' && unitById(selected.id); if (!u || !canCopy(u)) return;
  const copy = JSON.parse(JSON.stringify(u)); delete copy.places; copy.id = nextId(u.kind);
  const back = [view.cx, view.cz]; view.cx = u.x; view.cz = u.z; addUnit(copy); [view.cx, view.cz] = back;
}
function deleteSelected() {
  const u = selected?.type === 'unit' && unitById(selected.id); if (!u || !canDelete(u)) return;
  plan.units = plan.units.filter(x => x !== u); selected = null; commit();
}

// ---------------------------------------------------------------- library
function thumb(def, color) {
  const rects = [...def.solids, ...(def.places || [])], [x, z, w, d] = bounds(rects), pad = Math.max(w, d) * .08 + .5;
  const r = ([a, b, c, e], o) => `<rect x="${a - c / 2}" y="${b - e / 2}" width="${c}" height="${e}" fill="${color}" fill-opacity="${o}"/>`;
  return `<svg viewBox="${x - w / 2 - pad} ${z - d / 2 - pad} ${w + pad * 2} ${d + pad * 2}" aria-hidden="true">${def.solids.map(q => r(q, .3)).join('')}${(def.places || []).map(q => r(q, .85)).join('')}</svg>`;
}
function renderLibrary() {
  const box = $('library'), q = $('lib-search').value.trim().toLowerCase(); box.textContent = '';
  const count = kind => plan.units.filter(u => u.kind === kind).length;
  const size = def => { const [, , w, d] = bounds(def.places?.length ? def.places : def.solids); return `${+w.toFixed(1)} × ${+d.toFixed(1)} m`; };
  const entries = [
    { custom: true, cat: 'baru', name: 'Bangunan baru', def: kindDef({ kind: 'custom' }), note: 'Pilih bentuk, saiz, warna' },
    ...Object.entries(KINDS).filter(([kind])=>kind!=='passerby').map(([kind, def]) => ({ kind, def, cat: def.cat, name: def.label, n: count(kind) })),
    ...(plan.templates || []).map(t => ({ template: t, def: kindDef({ kind: 'custom', ...t }), cat: CATEGORIES.some(c => c.id === t.cat) ? t.cat : 'kedai', name: t.name }))
  ];
  const cats = [{ id: 'baru', name: 'Bina sendiri' }, ...CATEGORIES];
  for (const cat of cats) {
    const list = entries.filter(e => e.cat === cat.id && (!q || `${e.name} ${cat.name}`.toLowerCase().includes(q)));
    if (!list.length) continue;
    const section = document.createElement('section'); section.className = 'cat';
    section.innerHTML = `<h3><i style="background:${catColor[cat.id] || 'var(--gold)'}"></i><span></span><small>${list.length}</small></h3><div class="cards"></div>`;
    section.querySelector('h3 span').textContent = cat.name;
    for (const e of list) {
      const card = document.createElement('div'), taken = e.def.unique && e.n > 0, color = e.template ? customLook(e.template).wall : e.custom ? 'var(--gold)' : catColor[cat.id];
      card.className = 'card';
      const note = e.custom ? e.note : e.template ? `Template · ${size(e.def)}` : taken ? 'Sudah ada · tekan untuk cari' : `${size(e.def)} · ${e.n} di peta`;
      card.innerHTML = `<button>${thumb(e.def, color)}<b></b><small></small></button>${e.template ? '<button class="x" aria-label="Delete template" title="Delete template">✕</button>' : ''}`;
      card.querySelector('b').textContent = e.name; card.querySelector('small').textContent = note;
      card.firstChild.onclick = () => {
        if (e.custom) addCustom(CUSTOM_DEFAULTS);
        else if (e.template) addCustom(e.template);
        else if (taken) { const u = plan.units.find(x => x.kind === e.kind); selected = { type: 'unit', id: u.id }; view.cx = u.x; view.cz = u.z; showTab('edit'); applyView(); refresh(); }
        else addKind(e.kind);
      };
      if (e.template) card.lastChild.onclick = () => { plan.templates = plan.templates.filter(t => t !== e.template); if (!plan.templates.length) delete plan.templates; commit(); };
      section.querySelector('.cards').append(card);
    }
    box.append(section);
  }
  if (!box.children.length) box.innerHTML = '<p class="note">Tiada bangunan sepadan.</p>';
  box.insertAdjacentHTML('beforeend', '<p class="note">Aset muncul di ruang kosong berhampiran tengah peta. Drag untuk pindah, R untuk putar, Duplicate untuk gandakan. Pokok menggunakan model asal RetroMalaysia.</p>');
}

// ---------------------------------------------------------------- town size
const SIDES = [['minZ', 'Utara (atas)'], ['maxZ', 'Selatan (bawah)'], ['minX', 'Barat (kiri)'], ['maxX', 'Timur (kanan)']];
function renderTown() {
  const B = townBounds(), box = $('town-size'), w = B.maxX - B.minX, d = B.maxZ - B.minZ, D = DEFAULT_BOUNDS;
  const big = w * d > 2 * (D.maxX - D.minX) * (D.maxZ - D.minZ);
  box.innerHTML = `<section><p class="eyebrow">Saiz peta</p><h2>${w} × ${d} m</h2><p>Add or remove 10 m of grid on any side. Buildings stay where they are; new ground is empty land to build on.</p></section>
    <section class="sides">${SIDES.map(([key, label]) => { const at = Math.abs(B[key]); return `<span>${label}</span><button data-side="${key}" data-dir="-1" ${at <= 20 ? 'disabled' : ''} aria-label="Shrink ${label} by 10 m">− 10 m</button><button data-side="${key}" data-dir="1" ${at >= BOUNDS_LIMIT ? 'disabled' : ''} aria-label="Grow ${label} by 10 m">+ 10 m</button>`; }).join('')}</section>
    ${big ? '<p class="note">A big town plants more trees and lays longer routes, so it may run slower on older phones.</p>' : ''}
    <section><p class="eyebrow">Grid & snap</p><div class="tools">
      <label class="field">Grid lines<select id="grid-step"><option value="5">5 m</option><option value="10">10 m</option><option value="20">20 m</option></select></label>
      <label class="field">Snap<select id="snap-step"><option value="0.5">0.5 m</option><option value="1">1 m</option><option value="2">2 m</option><option value="5">5 m</option></select></label>
      <label class="field">Show grid<select id="grid-show"><option value="1">On</option><option value="0">Off</option></select></label>
    </div></section>
    <section><button id="bounds-reset" ${plan.bounds ? '' : 'disabled'}>Back to the original size</button></section>`;
  box.querySelectorAll('[data-side]').forEach(b => b.onclick = () => {
    const key = b.dataset.side, out = key.startsWith('min') ? -1 : 1, next = { ...B, [key]: B[key] + out * 10 * +b.dataset.dir };
    plan.bounds = boundsOf({ bounds: next }); commit(); fitView();
  });
  $('grid-step').value = gridStep; $('snap-step').value = SNAP; $('grid-show').value = showGrid ? '1' : '0';
  $('grid-step').onchange = () => { gridStep = +$('grid-step').value; saveView(); draw(); };
  $('snap-step').onchange = () => { SNAP = +$('snap-step').value; saveView(); };
  $('grid-show').onchange = () => { showGrid = $('grid-show').value === '1'; saveView(); draw(); };
  $('bounds-reset').onclick = () => { delete plan.bounds; commit(); fitView(); };
}
function showTab(name) {
  if(tab!==name)document.querySelector('.panel').scrollTop=0;
  tab = name;
  document.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === name)));
  document.querySelectorAll('[data-pane]').forEach(p => p.hidden = p.dataset.pane !== name);
  if (name === 'library') renderLibrary(); else if (name === 'town') renderTown();
}
document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => showTab(b.dataset.tab));
$('lib-search').oninput = renderLibrary;

// ---------------------------------------------------------------- input
function toWorldPoint(event) {
  const p = svg.createSVGPoint(); p.x = event.clientX; p.y = event.clientY;
  const m = svg.getScreenCTM().inverse(), q = p.matrixTransform(m); return [q.x, q.y];
}
const pointers = new Map(); let drag = null, pinch = null;
svg.addEventListener('pointerdown', event => {
  svg.setPointerCapture(event.pointerId);
  pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
  if (pointers.size === 2) { drag = null; const [a, b] = [...pointers.values()]; pinch = { dist: Math.hypot(a.x - b.x, a.y - b.y), scale: view.scale }; return; }
  const [x, z] = toWorldPoint(event), target = event.target.closest('[data-unit],[data-road],[data-handle]');
  if (target?.dataset.handle) { const r = roadById(selected.id); drag = { kind: 'handle', side: +target.dataset.handle, road: r, start: [x, z], orig: { ...r }, moved: false }; }
  else if (target?.dataset.unit) { const u = unitById(target.dataset.unit); selected = { type: 'unit', id: u.id }; drag = { kind: 'item', item: u, start: [x, z], orig: [u.x, u.z], moved: false }; refresh(); }
  else if (target?.dataset.road) { const r = roadById(target.dataset.road); selected = { type: 'road', id: r.id }; drag = { kind: 'item', item: r, start: [x, z], orig: [r.x, r.z], moved: false }; refresh(); }
  else drag = { kind: 'pan', screen: [event.clientX, event.clientY], orig: [view.cx, view.cz], moved: false };
});
let frame = 0;
svg.addEventListener('pointermove', event => {
  if (!pointers.has(event.pointerId)) return;
  pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
  if (pinch && pointers.size === 2) { const [a, b] = [...pointers.values()]; view.scale = Math.min(40, Math.max(1, pinch.scale * Math.hypot(a.x - b.x, a.y - b.y) / Math.max(1, pinch.dist))); cancelAnimationFrame(frame); frame = requestAnimationFrame(applyView); return; }
  if (!drag) return;
  if (drag.kind === 'pan') {
    const dx = event.clientX - drag.screen[0], dy = event.clientY - drag.screen[1];
    if (Math.hypot(dx, dy) > 4) drag.moved = true;
    view.cx = drag.orig[0] - dx / view.scale; view.cz = drag.orig[1] - dy / view.scale;
    cancelAnimationFrame(frame); frame = requestAnimationFrame(applyView); return;
  }
  const [x, z] = toWorldPoint(event), dx = x - drag.start[0], dz = z - drag.start[1];
  if (Math.hypot(dx, dz) * view.scale > 4) drag.moved = true;
  if (!drag.moved) return;
  if (drag.kind === 'item') { drag.item.x = snap(drag.orig[0] + dx); drag.item.z = snap(drag.orig[1] + dz); }
  else {
    const r = drag.road, o = drag.orig, alongX = o.w >= o.d, delta = alongX ? dx : dz, len = alongX ? o.w : o.d;
    const next = Math.max(2, snap(len + delta * drag.side)), shift = (next - len) / 2 * drag.side;
    if (alongX) { r.w = next; r.x = o.x + shift; } else { r.d = next; r.z = o.z + shift; }
  }
  cancelAnimationFrame(frame); frame = requestAnimationFrame(refresh);
});
function release(event) {
  pointers.delete(event.pointerId);
  if (pointers.size < 2) pinch = null;
  if (!drag) return;
  if (drag.kind === 'pan' && !drag.moved && selected) { selected = null; refresh(); }
  else if (drag.kind !== 'pan' && drag.moved) commit();
  drag = null;
}
svg.addEventListener('pointerup', release); svg.addEventListener('pointercancel', release);
svg.addEventListener('wheel', event => {
  event.preventDefault();
  const [x, z] = toWorldPoint(event), factor = Math.exp(-event.deltaY * .0015);
  const next = Math.min(40, Math.max(1, view.scale * factor));
  view.cx = x - (x - view.cx) * view.scale / next; view.cz = z - (z - view.cz) * view.scale / next; view.scale = next; applyView();
}, { passive: false });
window.addEventListener('keydown', event => {
  if (event.target.closest('input,select,textarea')) return;
  const mod = event.ctrlKey || event.metaKey, k = event.key;
  if (mod && k.toLowerCase() === 'z') { event.preventDefault(); event.shiftKey ? redo() : undo(); return; }
  if (mod && k.toLowerCase() === 'y') { event.preventDefault(); redo(); return; }
  if (!selected) return;
  if (mod && k.toLowerCase() === 'd') { event.preventDefault(); duplicateSelected(); return; }
  const stepSize = event.shiftKey ? 5 : SNAP;
  if (k === 'ArrowLeft') { event.preventDefault(); nudge(-stepSize, 0); } else if (k === 'ArrowRight') { event.preventDefault(); nudge(stepSize, 0); }
  else if (k === 'ArrowUp') { event.preventDefault(); nudge(0, -stepSize); } else if (k === 'ArrowDown') { event.preventDefault(); nudge(0, stepSize); }
  else if (k.toLowerCase() === 'r') turnSelected(event.shiftKey ? -1 : 1);
  else if (k === 'Escape') { selected = null; refresh(); }
  else if ((k === 'Delete' || k === 'Backspace') && selected.type === 'road') { plan.roads = plan.roads.filter(r => r.id !== selected.id); selected = null; commit(); }
  else if (k === 'Delete' || k === 'Backspace') deleteSelected();
});
$('undo').onclick = undo; $('redo').onclick = redo;
$('turn-left').onclick = () => turnSelected(-1); $('turn-right').onclick = () => turnSelected(1);
$('deselect').onclick = () => { selected = null; refresh(); };
$('zoom-in').onclick = () => { view.scale = Math.min(40, view.scale * 1.3); applyView(); };
$('zoom-out').onclick = () => { view.scale = Math.max(1, view.scale / 1.3); applyView(); };
$('zoom-fit').onclick = fitView;
new ResizeObserver(() => applyView()).observe(svg);
function showCopy() {
  const text = JSON.stringify(plan, null, 2), box = $('copybox');
  const done = () => { $('saveinfo').textContent = 'Layout copied. Simpan teks ini sebagai fail JSON.'; };
  navigator.clipboard?.writeText(text).then(done, () => { box.hidden = false; box.value = text; box.select(); $('saveinfo').textContent = 'Pilih dan salin teks map ini.'; }) ?? (box.hidden = false, box.value = text, box.select());
}
$('copy').onclick = showCopy;
async function save() {
  try { const at=new Date().toISOString();localStorage.setItem('crow-zero-draft-v1',JSON.stringify({plan,editedAt:Date.now(),savedAt:at}));savedAt=at;dirty=false;storageError=null; }
  catch { storageError='Map belum disimpan pada peranti. Storan penuh atau disekat. Gunakan Export JSON.'; }
  renderPanel();
}
$('save').onclick=save; $('save-2').onclick=save;
function resetPrompt(){
  const zone=$('reset-zone');showTab('edit');
  zone.innerHTML='<div class="confirm"><strong>Mulakan map kosong?</strong><p>Export JSON jika mahu salinan map semasa. Undo boleh pulihkan map selagi halaman ini terbuka.</p><div class="tools"><button id="reset-yes">Ya, map kosong</button><button id="reset-no">Batal</button></div></div>';
  const back=()=>{zone.innerHTML='<button id="reset">Map kosong baru</button>';$('reset').onclick=resetPrompt;};
  $('reset-no').onclick=back;
  $('reset-yes').onclick=()=>{plan=JSON.parse(BASE);selected=null;commit();fitView();back();};
  zone.scrollIntoView({block:'nearest'});
}
$('reset').onclick=resetPrompt;$('new-map').onclick=resetPrompt;
$('export').onclick=()=>{const blob=new Blob([JSON.stringify(plan,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='crow-zero-map.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
$('import').onclick=()=>$('import-file').click();
$('import-file').onchange=async event=>{
  try {
    const file=event.target.files[0];if(!file)return;if(file.size>2000000)throw Error('Fail terlalu besar (maksimum 2 MB).');
    const next=JSON.parse(await file.text()),errors=validatePlan(next);if(errors.length)throw Error(errors[0]);
    derive(next);plan=next;selected=null;commit();fitView();showTab('edit');
  }catch(error){$('saveinfo').textContent='Import gagal: '+error.message;showTab('edit');}
  event.target.value='';
};
$('legend').innerHTML = DISTRICT_INFO.map(d => `<span><i style="background:${d.color}"></i>${d.name}</span>`).join('') + `<span><i style="background:${kindColor.bus}"></i>Vehicles</span><span><i style="background:${kindColor.square}"></i>Town square</span><span><i style="background:#888;opacity:.6"></i>Extra buildings: their category colour</span>`;

// ---------------------------------------------------------------- start
const local=readLocal();
if(local?.plan && !validatePlan(local.plan).length){try{load(local.plan);savedAt=local.savedAt||null;}catch{ /* ignore an invalid stored draft */ }}
fitView();refresh();
</script>
