<title>Crow-Zero City Editor</title>
<style>
/* Layout: a site plan filling the screen, with a details rail (bottom sheet on phones). */
:root{
  --paper:#f9f4e5;--panel:#fffaf0;--ink:#243f37;--muted:#6f786c;--line:#d9d2bd;--green:#244e43;--gold:#c99c4e;
  --lawn:#dfe5c6;--edge:#c9d1ad;--river:#82aaa2;--asphalt:#a7aca5;--dirt:#d3c398;--floor:#efe8d2;
  --error:#b8433a;--warn:#b77b16;--ok:#3f7a55;--select:#1b2f29;
  --display:Georgia,"Times New Roman",serif;--body:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#16241f;--panel:#1c2d27;--ink:#ece4cd;--muted:#a9b29f;--line:#33463e;--green:#8fc3a9;--gold:#d9b06a;
  --lawn:#2b3b2e;--edge:#3d4f3b;--river:#3f6a66;--asphalt:#5e6560;--dirt:#77694a;--floor:#3a3a2c;
  --error:#ef7d6f;--warn:#e7ad4e;--ok:#7fc99a;--select:#fff3d2;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#16241f;--panel:#1c2d27;--ink:#ece4cd;--muted:#a9b29f;--line:#33463e;--green:#8fc3a9;--gold:#d9b06a;
  --lawn:#2b3b2e;--edge:#3d4f3b;--river:#3f6a66;--asphalt:#5e6560;--dirt:#77694a;--floor:#3a3a2c;
  --error:#ef7d6f;--warn:#e7ad4e;--ok:#7fc99a;--select:#fff3d2;color-scheme:dark}
html,body{height:100%}body{height:100dvh}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font:14px/1.45 var(--body);margin:0;overflow:hidden}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 11px;min-height:36px}
button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--green);border-color:var(--green);color:var(--paper);font-weight:650}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto minmax(0,1fr)}
.bar{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{font:33px/1 var(--display);letter-spacing:-7px;padding-right:7px;color:var(--green)}
.mark span{color:#b56b3b}
.brand strong{font:20px/1.1 var(--display);font-weight:400;display:block}
.brand small{display:block;font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:650;border:1px solid currentColor}
.pill.ok{color:var(--ok)}.pill.error{color:var(--error)}.pill.warn{color:var(--warn)}
.bar .spacer{flex:1}
.bar .actions{display:flex;gap:8px;flex-wrap:wrap}
.stage{grid-row:2;grid-column:1;position:relative;min-height:0;background:var(--edge)}
#map{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.mapbar{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.mapbar button{width:38px;padding:0;font-weight:700}
.floater{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:flex;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px 6px 5px 12px;box-shadow:0 4px 18px rgba(20,40,30,.14);max-width:calc(100% - 80px)}
.floater span{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.scale{position:absolute;left:12px;bottom:12px;font:11px var(--mono);color:var(--ink);background:color-mix(in srgb,var(--panel) 85%,transparent);padding:4px 8px;border-radius:7px}
.panel{grid-row:2;grid-column:2;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:18px}
.panel h2{font:19px/1.2 var(--display);font-weight:400;margin:0 0 6px}
.eyebrow{font-size:10px;font-weight:750;letter-spacing:1.8px;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.panel p{margin:0;color:var(--muted)}
.rows{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0;font-variant-numeric:tabular-nums}
.rows dt{color:var(--muted)}.rows dd{margin:0}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 8px;width:96px}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.checks li button{width:100%;text-align:left;display:flex;gap:8px;align-items:flex-start;border-radius:10px;padding:8px 10px}
.checks .dot{flex:none;width:9px;height:9px;border-radius:50%;margin-top:6px}
.checks .error .dot{background:var(--error)}.checks .warning .dot{background:var(--warn)}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:4px 10px;font-size:12px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.saveinfo{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:2px;margin:-16px -16px 0;padding:6px 10px 0;border-bottom:1px solid var(--line);position:sticky;top:-16px;background:var(--panel);z-index:2}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;font-weight:650;color:var(--muted);padding:8px 10px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.pane{display:flex;flex-direction:column;gap:18px}
.search{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:8px 10px}
.cat h3{font:16px/1.2 var(--display);font-weight:400;margin:4px 0 8px;display:flex;align-items:center;gap:8px}
.cat h3 i{width:10px;height:10px;border-radius:3px;display:inline-block}
.cat h3 small{margin-left:auto;font:11px var(--body);color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:6px}
.card{position:relative}
.card>button:first-child{width:100%;height:100%;display:flex;flex-direction:column;align-items:stretch;gap:3px;text-align:left;padding:8px;border-radius:10px}
.card svg{width:100%;height:46px;display:block}
.card b{font-size:12.5px;line-height:1.25;font-weight:650}
.card small{font-size:11px;color:var(--muted)}
.card .x{position:absolute;top:4px;right:4px;min-height:0;width:24px;height:24px;padding:0;border-radius:7px;font-size:12px;line-height:1}
.sides{display:grid;grid-template-columns:1fr auto auto;gap:6px 8px;align-items:center}
.field input[type=color]{padding:2px;height:34px}
.field input.wide{width:100%}
.note{font-size:12px;color:var(--muted)}
.confirm{display:flex;flex-direction:column;gap:8px;border:1px solid var(--error);border-radius:10px;padding:10px}
a{color:var(--green)}
svg text{font-family:var(--body);pointer-events:none}
.unit{cursor:grab}.unit.dragging{cursor:grabbing}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(180px,1.2fr) minmax(160px,1fr)}
  .stage{grid-row:2;grid-column:1}
  .panel{grid-row:3;grid-column:1;border-left:0;border-top:1px solid var(--line)}
  .bar{padding:8px 16px}
  .brand strong{font-size:17px}.mark{font-size:26px}
}
@media (max-width:1000px) and (max-height:500px) and (orientation:landscape){
  .app{grid-template-columns:minmax(0,1fr) 280px;grid-template-rows:auto minmax(0,1fr)}
  .stage{grid-row:2;grid-column:1}
  .panel{grid-row:2;grid-column:2;border-top:0;border-left:1px solid var(--line)}
  .bar{padding:6px 10px;gap:6px}.brand strong{font-size:16px}.brand small{display:none}
  .bar .actions{gap:4px}.bar button{padding:6px 8px}
}
@media (prefers-reduced-motion:no-preference){.floater{transition:opacity .15s}}
</style>

<div class="app">
  <header class="bar">
    <div class="brand"><span class="mark" aria-hidden="true">C<span>Z</span></span><div><strong>Crow-Zero · City Editor</strong><small>Bina bandar sendiri · map editor</small></div></div>
    <span id="status" class="pill ok" role="status">Checking…</span>
    <span class="spacer"></span>
    <div class="actions">
      <button id="undo" aria-label="Undo" title="Undo (Ctrl+Z)">Undo</button>
      <button id="redo" aria-label="Redo" title="Redo (Ctrl+Shift+Z)">Redo</button>
      <button id="new-map">Map kosong</button><button id="import">Import JSON</button><input id="import-file" type="file" accept=".json,application/json" hidden><button id="export">Export JSON</button><button id="save" class="primary">Simpan</button>
    </div>
  </header>
  <main class="stage">
    <svg id="map" aria-label="Town plan. Drag buildings and roads to move them."></svg>
    <div class="floater" id="floater" hidden>
      <span id="floater-name"></span>
      <button id="turn-left" aria-label="Turn left 90 degrees" title="Turn left (Shift+R)">↺</button>
      <button id="turn-right" aria-label="Turn right 90 degrees" title="Turn right (R)">↻</button>
      <button id="deselect" aria-label="Deselect" title="Deselect (Esc)">✕</button>
    </div>
    <div class="mapbar">
      <button id="zoom-in" aria-label="Zoom in">+</button>
      <button id="zoom-out" aria-label="Zoom out">−</button>
      <button id="zoom-fit" aria-label="Fit the whole town" title="Fit">⤢</button>
    </div>
    <div class="scale" id="scale">10 m</div>
  </main>
  <aside class="panel">
    <nav class="tabs" role="tablist" aria-label="Editor tools">
      <button role="tab" data-tab="edit" aria-selected="true">Edit</button>
      <button role="tab" data-tab="library" aria-selected="false">+ Aset</button>
      <button role="tab" data-tab="town" aria-selected="false">Saiz peta</button>
    </nav>
    <div class="pane" data-pane="library" hidden>
      <input id="lib-search" class="search" type="search" placeholder="Cari bangunan, pokok atau kategori…" aria-label="Search buildings">
      <div class="pane" id="library"></div>
    </div>
    <div class="pane" data-pane="town" id="town-size" hidden></div>
    <div class="pane" data-pane="edit">
    <section id="selection"></section>
    <section>
      <p class="eyebrow">Layout checks</p>
      <ul class="checks" id="checks"></ul>
    </section>
    <section>
      <p class="eyebrow">Save and try it</p>
      <div class="tools">
        <button id="save-2" class="primary">Save layout</button>
        <button id="copy">Copy layout</button>
        <a id="preview" class="preview" href="#" target="_blank" rel="noopener">Preview FPS ↗</a>
        <a id="play" class="preview" href="#" target="_blank" rel="noopener">Main: Operasi Gagak ▶</a>
      </div>
      <p class="saveinfo" id="saveinfo" role="status" style="margin-top:8px"></p>
      <textarea id="copybox" hidden readonly style="width:100%;height:90px;margin-top:8px;font:11px var(--mono)"></textarea>
    </section>
    <section>
      <p class="eyebrow">Districts</p>
      <div class="legend" id="legend"></div>
    </section>
    <section id="reset-zone">
      <button id="reset">Map kosong baru</button>
    </section>
    </div>
  </aside>
</div>

<script type="module">
/*@LAYOUT@*/

// ---------------------------------------------------------------- state
// On the game's own site the preview opens next door; elsewhere (a Claude artifact) the published game.
const GAME_URL = new URL('../preview.html', location.href).href;
const PLAY_URL = new URL('../', location.href).href;
const BASE = JSON.stringify(TOWN_PLAN);
let SNAP = .5, gridStep = 10, showGrid = true, tab = 'edit';
try { ({ snap: SNAP = .5, grid: gridStep = 10, show: showGrid = true } = JSON.parse(localStorage.getItem('crow-zero-view-v1') || '{}')); } catch { /* storage unavailable */ }
const $ = id => document.getElementById(id);
const svg = $('map'), NS = 'http://www.w3.org/2000/svg';
let plan = JSON.parse(BASE), town = derive(plan), problems = planProblems(plan);
let selected = null; // {type: 'unit'|'road', id}
let history = [BASE], step = 0, dirty = false, savedAt = null, storageError = null;
const view = { cx: -1, cz: 0, scale: 4 };
const zoneColor = Object.fromEntries(DISTRICT_INFO.map(d => [d.id, d.color]));
const kindColor = { square: '#7f9c6a', bus: '#557a8c', sedan: '#557a8c', passerby: '#b15c33' };
const catColor = { rumah: '#c87537', kedai: '#b95670', komuniti: '#4a9270', pokok:'#638552', misi:'#c99c4e', rehat: '#7f9c6a', jalan: '#4b8db4', kenderaan: '#557a8c' };
const LOOK = Object.keys(CUSTOM_DEFAULTS);
const townBounds = () => boundsOf(plan);
const FACING = ['south', 'east', 'north', 'west'];
const snap = v => Math.round(v / SNAP) * SNAP;
const unitById = id => plan.units.find(u => u.id === id);
const roadById = id => plan.roads.find(r => r.id === id);
// Plan units list place ids; derived units list {id, rect}. Accept both.
const placeIds = u => (u.places || []).map(p => typeof p === 'object' ? p.id : p);
const nameOf = u => { const ids = placeIds(u), def = kindDef(u); return ids.length === 1 ? PLACES[ids[0]][0] : ids.length ? def.label : u.name || (u.kind === 'passerby' ? 'Passer-by spot' : def.label); };
const colorOf = u => { const ids = placeIds(u); return ids.length ? zoneColor[PLACES[ids[0]][1]] : u.kind === 'custom' ? customLook(u).wall : kindColor[u.kind] || catColor[kindDef(u).cat] || '#888'; };
// Extra (unnumbered) buildings can be deleted; any kind not marked unique can be added again.
const canDelete = () => true;
const canCopy = u => !KINDS[u.kind]?.unique;
const nextId = base => { let n = 2; while (unitById(`${base}-${n}`)) n++; return `${base}-${n}`; };
function saveView() { try { localStorage.setItem('crow-zero-view-v1', JSON.stringify({ snap: SNAP, grid: gridStep, show: showGrid })); } catch { /* storage unavailable */ } }
const roadName = r => r.id.replace(/-/g, ' ').replace(/^\w/, c => c.toUpperCase());
function readLocal() { try { return JSON.parse(localStorage.getItem('crow-zero-draft-v1') || 'null'); } catch { return null; } }
function writeLocal() {
  try { localStorage.setItem('crow-zero-draft-v1', JSON.stringify({ plan, editedAt: Date.now(), savedAt })); storageError = null; }
  catch { storageError = 'Map belum disimpan pada peranti. Storan penuh atau disekat. Gunakan Export JSON.'; }
}

// ---------------------------------------------------------------- edits
function commit() {
  const json = JSON.stringify(plan);
  if (json === history[step]) return;
  history = history.slice(0, step + 1); history.push(json); step = history.length - 1;
  if (history.length > 200) { history.shift(); step--; }
  dirty = true; writeLocal(); refresh();
}
function load(next, { keepHistory = false } = {}) {
  plan = JSON.parse(JSON.stringify(next));
  if (!keepHistory) { history = [JSON.stringify(plan)]; step = 0; }
  if (selected && !(selected.type === 'unit' ? unitById(selected.id) : roadById(selected.id))) selected = null;
  refresh();
}
function undo() { if (step > 0) { step--; load(JSON.parse(history[step]), { keepHistory: true }); dirty = true; writeLocal(); renderPanel(); } }
function redo() { if (step < history.length - 1) { step++; load(JSON.parse(history[step]), { keepHistory: true }); dirty = true; writeLocal(); renderPanel(); } }
function turnSelected(dir) {
  if (!selected) return;
  if (selected.type === 'unit') { const u = unitById(selected.id); u.rot = ((u.rot || 0) + (dir > 0 ? 3 : 1)) % 4; }
  else { const r = roadById(selected.id); [r.w, r.d] = [r.d, r.w]; }
  commit();
}
function nudge(dx, dz) {
  if (!selected) return;
  const item = selected.type === 'unit' ? unitById(selected.id) : roadById(selected.id);
  item.x = snap(item.x + dx); item.z = snap(item.z + dz); commit();
}

// ---------------------------------------------------------------- drawing
function el(name, attrs = {}, parent) {
  const node = document.createElementNS(NS, name);
  for (const [k, v] of Object.entries(attrs)) if (v !== undefined && v !== null) node.setAttribute(k, v);
  if (parent) parent.append(node); return node;
}
const rect = ([x, z, w, d], attrs, parent) => el('rect', { x: x - w / 2, y: z - d / 2, width: w, height: d, ...attrs }, parent);
function fitView() {
  const { width, height } = svg.getBoundingClientRect();
  const B = townBounds();
  view.scale = Math.max(.5, Math.min(width / (B.maxX - B.minX + 14), height / (B.maxZ - B.minZ + 14))); view.cx = (B.minX + B.maxX) / 2; view.cz = (B.minZ + B.maxZ) / 2; applyView();
}
function applyView() {
  const { width, height } = svg.getBoundingClientRect();
  const w = Math.max(1, width) / view.scale, h = Math.max(1, height) / view.scale;
  svg.setAttribute('viewBox', `${view.cx - w / 2} ${view.cz - h / 2} ${w} ${h}`);
  const metres = [5, 10, 20, 50].find(m => m * view.scale >= 60) || 50;
  $('scale').innerHTML = `<span style="display:inline-block;width:${Math.round(metres * view.scale)}px;border-bottom:2px solid currentColor;margin-right:6px"></span>${metres} m`;
  draw();
}
function draw() {
  svg.textContent = '';
  const px = 1 / view.scale, css = getComputedStyle(document.documentElement), token = n => css.getPropertyValue(n).trim();
  const errorUnits = new Set(), warnUnits = new Set(), warnRoads = new Set();
  for (const p of problems) for (const id of p.units) (p.level === 'error' ? errorUnits : warnUnits).add(id);
  for (const p of problems) for (const id of p.roads || []) warnRoads.add(id);
  // Ground, town edge, the fixed river and bridges.
  const B = townBounds(), G = groundOf(B);
  rect([(G.minX + G.maxX) / 2, (G.minZ + G.maxZ) / 2, G.maxX - G.minX + 20, G.maxZ - G.minZ + 20], { fill: token('--edge') }, svg);
  rect([(B.minX + B.maxX) / 2, (B.minZ + B.maxZ) / 2, B.maxX - B.minX, B.maxZ - B.minZ], { fill: token('--lawn') }, svg);
  const grid = el('g', { stroke: token('--ink'), 'stroke-opacity': .07, 'stroke-width': px }, svg);
  if (showGrid) {
    for (let x = Math.ceil(B.minX / gridStep) * gridStep; x <= B.maxX; x += gridStep) el('line', { x1: x, x2: x, y1: B.minZ, y2: B.maxZ, 'stroke-opacity': x % 50 ? .07 : .17 }, grid);
    for (let z = Math.ceil(B.minZ / gridStep) * gridStep; z <= B.maxZ; z += gridStep) el('line', { y1: z, y2: z, x1: B.minX, x2: B.maxX, 'stroke-opacity': z % 50 ? .07 : .17 }, grid);
  }
  // No fixed river: the city starts on empty land.
  for (const b of town.bridges) rect([b.x, b.z, b.w, b.d], { fill: token('--dirt'), stroke: token('--ink'), 'stroke-opacity': .3, 'stroke-width': px }, svg);
  // Raised floors and plazas under everything else.
  for (const u of town.units) for (const f of u.floors) if (f[2] * f[3] > 30) rect(f, { fill: token('--floor'), opacity: .85 }, svg);
  // Roads: tap to select, drag to move; end handles change the length.
  for (const r of plan.roads) {
    const on = selected?.type === 'road' && selected.id === r.id;
    const node = rect([r.x, r.z, r.w, r.d], { fill: r.kind === 'asphalt' ? token('--asphalt') : token('--dirt'), stroke: on ? token('--select') : warnRoads.has(r.id) ? token('--warn') : 'none', 'stroke-width': on ? 3 * px : 2 * px, 'data-road': r.id, class: 'unit' }, svg);
    node.append(el('title')); node.firstChild.textContent = roadName(r);
  }
  // Units: solids, places with numbers, a front arrow and problem outlines.
  const labels = [];
  for (const u of town.units) {
    const on = selected?.type === 'unit' && selected.id === u.id, color = colorOf(u);
    const g = el('g', { 'data-unit': u.id, class: 'unit' }, svg);
    const [ax, az, aw, ad] = u.area, hit = Math.max(aw, ad) < 3 ? 6 * px * 2 : 0;
    if (hit) rect([ax, az, Math.max(aw, hit), Math.max(ad, hit)], { fill: 'transparent' }, g);
    for (const s of u.solids) rect(s, { fill: color, 'fill-opacity': u.places.length ? .35 : .7, stroke: color, 'stroke-opacity': .7, 'stroke-width': px }, g);
    for (const p of u.places) rect(p.rect, { fill: color, 'fill-opacity': .85, stroke: token('--ink'), 'stroke-opacity': .45, 'stroke-width': px }, g);
    // Front arrow: local +z edge of the unit.
    const [, , , d0] = u.def.places[0] || u.def.solids[0], tipLocal = (u.def.places[0] || u.def.solids[0])[1] + d0 / 2 + 1.6;
    const sizeArrow = Math.max(1.1, 7 * px), lx = (u.def.places[0] || u.def.solids[0])[0];
    const pts = [[lx, tipLocal], [lx - sizeArrow, tipLocal - sizeArrow * 1.2], [lx + sizeArrow, tipLocal - sizeArrow * 1.2]].map(([a, b]) => toWorld(u, a, b).join(',')).join(' ');
    if (u.kind !== 'passerby') el('polygon', { points: pts, fill: token('--ink'), 'fill-opacity': on ? .9 : .45 }, g);
    if (errorUnits.has(u.id) || warnUnits.has(u.id)) rect([ax, az, aw + 1, ad + 1], { fill: 'none', stroke: errorUnits.has(u.id) ? token('--error') : token('--warn'), 'stroke-width': 3 * px, 'stroke-dasharray': errorUnits.has(u.id) ? 'none' : `${6 * px} ${4 * px}`, rx: 1 }, g);
    if (on) rect([ax, az, aw + 2.4, ad + 2.4], { fill: 'none', stroke: token('--select'), 'stroke-width': 2.5 * px, 'stroke-dasharray': `${8 * px} ${5 * px}`, rx: 1.5 }, g);
    const badge = Math.max(1.8, 9 * px);
    for (const p of u.places) {
